name: Bot Server

on:
  schedule:
    - cron: '45 */5 * * *'
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: Restore Persistent Bot State
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/bot-server/state.json
          key: bot-server-state-persistent

      - name: Setup Environment
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          LOVE_WHISPERS_ENV: ${{ secrets.LOVE_WHISPERS_ENV }}
          PACKTOGETHER_ENV: ${{ secrets.PACKTOGETHER_ENV }}
        run: ./scripts/setup.sh

      - name: Start Telegram Bots, Panel & Tunnels
        env:
          SERVER_USERNAME: ${{ vars.SERVER_USERNAME || secrets.SERVER_USERNAME || 'admin' }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD || 'admin' }}
          GH_PAT: ${{ secrets.GH_PAT }}
          STATUS_BOT_TOKEN: ${{ secrets.STATUS_BOT_TOKEN }}
          STATUS_CHAT_ID: ${{ secrets.STATUS_CHAT_ID }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: ./scripts/start-bots.sh

      - name: Send Startup Notification to Telegram
        env:
          STATUS_BOT_TOKEN: ${{ secrets.STATUS_BOT_TOKEN }}
          STATUS_CHAT_ID: ${{ secrets.STATUS_CHAT_ID }}
          SERVER_USERNAME: ${{ vars.SERVER_USERNAME || secrets.SERVER_USERNAME || 'admin' }}
        run: ./scripts/heartbeat.sh

      - name: Keep Server Active (5h 45m or until Redeploy)
        run: |
          echo "Server running for 5 hours 45 minutes (20700s). Checking for early redeploy trigger..."
          TOTAL_SECONDS=20700
          ELAPSED=0
          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            if [ -f /tmp/redeploy.trigger ]; then
              echo ">> Redeploy triggered! Shutting down current server to allow new instance to take over..."
              break
            fi
            sleep 2
            ELAPSED=$((ELAPSED + 2))
            if [ $((ELAPSED % 1800)) -eq 0 ]; then
              MINS=$((ELAPSED / 60))
              echo "[$MINS/345m] Server is active and operational."
            fi
          done

      - name: Stop Bots, Panel & Tunnels
        if: always()
        run: ./scripts/stop-bots.sh

      - name: Save Persistent Bot State
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/bot-server/state.json
          key: bot-server-state-persistent-${{ github.run_id }}

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-server-logs-${{ github.run_id }}
          path: |
            /tmp/love-whispers.log
            /tmp/packtogether.log
            /tmp/panel.log
            /tmp/cloudflared.log
            /tmp/sshx.log
          if-no-files-found: warn

      - name: Trigger Next Workflow Run (if not redeploying)
        if: always()
        run: |
          if [ -f /tmp/redeploy.trigger ]; then
            echo "Redeploy already scheduled by trigger. Skipping duplicate dispatch."
          else
            echo "5h 45m session finished. Triggering next workflow run..."
            gh workflow run server.yml --ref ${{ github.ref }} || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
