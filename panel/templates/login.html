<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bot Control Center</title>
    <style>
        :root {
            --bg: #080b12;
            --panel: #101722;
            --border: #202b3b;
            --border-light: #2a374a;
            --text: #edf2f7;
            --text-muted: #667386;
            --accent: #38bdf8;
            --red: #fb7185;
            --radius: 12px;
            --mono: "JetBrains Mono", Consolas, monospace;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            display: grid; place-items: center;
            background: radial-gradient(circle at 20% -10%, rgba(56, 189, 248, .07), transparent 35%), var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, sans-serif;
        }

        .login-card {
            width: 100%; max-width: 380px; padding: 28px;
            background: var(--panel); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.3);
        }

        .brand-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .brand-mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: rgba(56,189,248,.15); font-size: 20px; }
        .brand-title { font-size: 16px; font-weight: 700; }
        .brand-sub { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); margin-bottom: 6px; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 10px 12px; border-radius: 7px;
            background: #0a1019; border: 1px solid var(--border-light);
            color: var(--text); font-family: var(--mono); font-size: 13px; outline: none;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56,189,248,.2); }

        .btn-submit {
            width: 100%; padding: 10px; margin-top: 10px; border-radius: 7px; border: none;
            background: var(--accent); color: #080b12; font-weight: 700; font-size: 13px; cursor: pointer;
        }
        .btn-submit:hover { opacity: .9; }

        .error-msg { background: rgba(251,113,133,.12); border: 1px solid rgba(251,113,133,.3); color: var(--red); padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 16px; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-header">
        <div class="brand-mark">🔒</div>
        <div>
            <div class="brand-title">Bot Control Center</div>
            <div class="brand-sub">Authentication Required</div>
        </div>
    </div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form action="/login" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
    </form>
</div>

</body>
</html>
